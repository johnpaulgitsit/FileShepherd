# application-production.properties (Full application mode)
# MySQL DB Connection (using .env variables loaded by spring-dotenv)



spring.datasource.url=jdbc:mysql://localhost:${MYSQLPORT}/${DB}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Google Cloud Storage
spring.cloud.gcp.storage.bucket=${MYBUCKET}
spring.cloud.gcp.credentials.location=${GCPKEYPATH}

# Production settings
wizard.mode=false